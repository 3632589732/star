<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面已迁移 · 流星雨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 30% 20%, #0b0e1a 0%, #05070f 80%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow: hidden;
            position: relative;
            padding: 20px 0;
        }

        /* 星空背景 */
        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 0.8; }
        }

        /* 流星 */
        .meteor {
            position: fixed;
            width: 120px;
            height: 1.5px;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.9) 100%);
            border-radius: 999px;
            transform: rotate(-35deg);
            opacity: 0;
            pointer-events: none;
            z-index: 1;
            animation: meteorFall 4s linear infinite;
        }

        @keyframes meteorFall {
            0% {
                opacity: 0;
                transform: rotate(-35deg) translateX(0);
            }
            5% {
                opacity: 1;
            }
            20% {
                opacity: 0;
                transform: rotate(-35deg) translateX(-600px) translateY(400px);
            }
            100% {
                opacity: 0;
                transform: rotate(-35deg) translateX(-600px) translateY(400px);
            }
        }

        /* 主卡片 */
        .card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 480px;
            padding: 40px 32px 34px;
            background: rgba(12, 16, 30, 0.82);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.02) inset,
                0 30px 60px -20px rgba(0, 0, 0, 0.7),
                0 0 80px -20px rgba(120, 160, 255, 0.15);
            text-align: center;
            color: #e8edf5;
        }

        /* 图标区 */
        .icon-wrap {
            margin-bottom: 18px;
        }

        .icon-circle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: linear-gradient(145deg, rgba(255,255,255,0.06), rgba(255,255,255,0.01));
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 30px;
            line-height: 1;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* 标题 */
        .title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f5f7ff 0%, #a8c0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 副标题 / 说明 */
        .subtitle {
            font-size: 14px;
            line-height: 1.8;
            color: #8a96b0;
            margin-bottom: 20px;
            padding: 0 4px;
        }

        .subtitle strong {
            color: #c0cee8;
            font-weight: 500;
        }

        /* ===== 微信无法打开 · 醒目警告条 ===== */
        .wx-warning {
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
            margin: 0 0 18px;
            padding: 14px 16px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(255, 138, 61, 0.22) 0%, rgba(255, 74, 74, 0.16) 100%);
            border: 1.5px solid rgba(255, 152, 74, 0.55);
            box-shadow:
                0 0 22px -6px rgba(255, 138, 61, 0.45),
                inset 0 0 18px -10px rgba(255, 180, 100, 0.6);
            animation: warnPulse 2.2s ease-in-out infinite;
        }

        @keyframes warnPulse {
            0%, 100% {
                border-color: rgba(255, 152, 74, 0.45);
                box-shadow: 0 0 18px -8px rgba(255, 138, 61, 0.35),
                            inset 0 0 18px -10px rgba(255, 180, 100, 0.45);
            }
            50% {
                border-color: rgba(255, 180, 90, 0.95);
                box-shadow: 0 0 30px -6px rgba(255, 152, 74, 0.75),
                            inset 0 0 18px -6px rgba(255, 200, 120, 0.7);
            }
        }

        .wx-warning .warn-icon {
            flex-shrink: 0;
            font-size: 22px;
            line-height: 1;
            animation: warnShake 1.8s ease-in-out infinite;
        }

        @keyframes warnShake {
            0%, 80%, 100% { transform: rotate(0deg); }
            85% { transform: rotate(-10deg); }
            90% { transform: rotate(10deg); }
            95% { transform: rotate(-6deg); }
        }

        .wx-warning .warn-text {
            font-size: 14px;
            line-height: 1.6;
            color: #ffd9a8;
            font-weight: 500;
        }

        .wx-warning .warn-text strong {
            display: block;
            font-size: 15px;
            font-weight: 700;
            color: #ffb454;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        /* 新地址展示（点击即复制） */
        .new-address {
            display: block;
            width: 100%;
            margin: 0 auto 10px;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px dashed rgba(160, 190, 255, 0.25);
            border-radius: 12px;
            font-size: 15px;
            color: #a8c0ff;
            text-decoration: none;
            word-break: break-all;
            transition: background 0.25s, border-color 0.25s;
            font-family: "SF Mono", "Menlo", monospace;
            letter-spacing: 0.3px;
            cursor: pointer;
            user-select: all;
            -webkit-user-select: all;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        .new-address:hover {
            background: rgba(160, 190, 255, 0.08);
            border-color: rgba(160, 190, 255, 0.5);
        }

        /* 复制按钮 */
        .btn {
            display: inline-block;
            width: 100%;
            padding: 15px 24px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #5b7cfa 0%, #8b5cf6 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
            box-shadow: 0 8px 28px -8px rgba(91, 124, 250, 0.55);
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 34px -8px rgba(91, 124, 250, 0.7);
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: 0 4px 16px -6px rgba(91, 124, 250, 0.5);
        }

        /* 复制成功状态 */
        .btn.copied {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            box-shadow: 0 8px 28px -8px rgba(34, 197, 94, 0.6);
        }

        /* 底部小字 */
        .footer-note {
            margin-top: 18px;
            font-size: 12px;
            color: #4d5a73;
            letter-spacing: 0.5px;
            min-height: 16px;
            line-height: 1.6;
            transition: color 0.3s;
        }

        .footer-note.ok {
            color: #4ade80;
        }

        /* 装饰 */
        .deco-line {
            width: 40px;
            height: 2px;
            margin: 0 auto 18px;
            background: linear-gradient(90deg, transparent, rgba(160, 190, 255, 0.4), transparent);
            border-radius: 999px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 20px 26px;
                border-radius: 20px;
            }
            .title {
                font-size: 19px;
            }
            .subtitle {
                font-size: 13px;
                margin-bottom: 16px;
            }
            .btn {
                padding: 14px 20px;
                font-size: 15px;
            }
            .new-address {
                font-size: 13px;
                padding: 12px 14px;
            }
            .wx-warning {
                padding: 12px 13px;
                gap: 8px;
            }
            .wx-warning .warn-icon {
                font-size: 19px;
            }
            .wx-warning .warn-text {
                font-size: 13px;
            }
            .wx-warning .warn-text strong {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- 星空层 -->
    <div class="stars" id="stars"></div>

    <!-- 流星层 -->
    <div class="meteor" style="top: 10%; left: 70%; animation-delay: 0s;"></div>
    <div class="meteor" style="top: 5%; left: 90%; animation-delay: 1.8s; width: 90px;"></div>
    <div class="meteor" style="top: 25%; left: 80%; animation-delay: 3.5s; width: 150px;"></div>

    <!-- 主卡片 -->
    <main class="card">
        <div class="icon-wrap">
            <div class="icon-circle">🌠</div>
        </div>

        <h1 class="title">本页面已停止更新</h1>

        <p class="subtitle">
            感谢你曾经在这里停留。<br>
            <strong>新的功能与内容</strong>已迁移至全新页面。
        </p>

        <!-- 醒目警告：微信打不开 -->
        <div class="wx-warning" role="alert">
            <span class="warn-icon">⚠️</span>
            <span class="warn-text">
                <strong>微信内无法打开此链接</strong>
                请复制下方地址，到手机浏览器中粘贴访问
            </span>
        </div>

        <div class="deco-line"></div>

        <!-- 点击复制地址 -->
        <div class="new-address" id="newAddress" role="button" tabindex="0"
             title="点击复制">https://x.gd/WykHV</div>

        <!-- 复制按钮（不会跳转） -->
        <button class="btn" id="copyBtn" type="button">复制新地址</button>

        <p class="footer-note" id="footerNote">复制后请在浏览器打开 · 微信内不支持访问</p>
    </main>

    <script>
        (function() {
            // 生成星星
            const starsContainer = document.getElementById('stars');
            const count = 80;
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = (Math.random() * 2 + 1) + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = (Math.random() * 3) + 's';
                star.style.animationDuration = (Math.random() * 2 + 2) + 's';
                starsContainer.appendChild(star);
            }

            // ===== 复制逻辑 =====
            const NEW_URL = 'https://x.gd/WykHV';
            const copyBtn = document.getElementById('copyBtn');
            const addressEl = document.getElementById('newAddress');
            const footerNote = document.getElementById('footerNote');

            let resetTimer = null;

            // 降级复制方案（兼容非安全上下文 / 旧浏览器）
            function fallbackCopy(text) {
                try {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.setAttribute('readonly', '');
                    ta.style.position = 'fixed';
                    ta.style.top = '0';
                    ta.style.left = '0';
                    ta.style.opacity = '0';
                    ta.style.pointerEvents = 'none';
                    document.body.appendChild(ta);
                    ta.select();
                    ta.setSelectionRange(0, ta.value.length);
                    const ok = document.execCommand('copy');
                    document.body.removeChild(ta);
                    return ok;
                } catch (e) {
                    return false;
                }
            }

            function copyText(text) {
                // 优先使用现代剪贴板 API
                if (navigator.clipboard && window.isSecureContext) {
                    return navigator.clipboard.writeText(text)
                        .then(function() { return true; })
                        .catch(function() { return fallbackCopy(text); });
                }
                return Promise.resolve(fallbackCopy(text));
            }

            function showSuccess() {
                copyBtn.classList.add('copied');
                copyBtn.textContent = '已复制 ✓';
                footerNote.textContent = '已复制！请打开手机浏览器粘贴访问（微信内打不开）';
                footerNote.classList.add('ok');

                clearTimeout(resetTimer);
                resetTimer = setTimeout(function() {
                    copyBtn.classList.remove('copied');
                    copyBtn.textContent = '复制新地址';
                    footerNote.textContent = '复制后请在浏览器打开 · 微信内不支持访问';
                    footerNote.classList.remove('ok');
                }, 3000);
            }

            function showFail() {
                // 复制失败时，自动选中地址方便手动复制
                try {
                    const range = document.createRange();
                    range.selectNodeContents(addressEl);
                    const sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(range);
                } catch (e) {}

                copyBtn.textContent = '请长按 / 手动复制上方地址';
                footerNote.textContent = '自动复制失败，已为你选中地址';
                footerNote.classList.remove('ok');

                clearTimeout(resetTimer);
                resetTimer = setTimeout(function() {
                    copyBtn.textContent = '复制新地址';
                    footerNote.textContent = '复制后请在浏览器打开 · 微信内不支持访问';
                }, 3200);
            }

            function handleCopy() {
                copyText(NEW_URL).then(function(ok) {
                    ok ? showSuccess() : showFail();
                });
            }

            copyBtn.addEventListener('click', handleCopy);

            // 点击地址本身也能复制
            addressEl.addEventListener('click', handleCopy);

            // 键盘可访问性
            addressEl.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    handleCopy();
                }
            });
        })();
    </script>

</body>
</html>
